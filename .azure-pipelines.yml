trigger:
- master

jobs:
- job: macOS
  strategy:
    matrix:
      Tahoe:
        vmImage: 'macOS-26'
        legName: 'Tahoe'
  displayName: 'macOS'
  pool:
    vmImage: $(vmImage)
  steps:
  - script: ./test.sh
    displayName: test script
  - script: |
      mkdir -p "$(Agent.TempDirectory)/logs"
      sudo log collect --start "$(cat "$HOME/test-start-time")" --output "$(Agent.TempDirectory)/logs/system_logs_$(legName).logarchive"
      sudo tar -czf "$(Agent.TempDirectory)/logs/system_logs_$(legName).logarchive.tar.gz" -C "$(Agent.TempDirectory)/logs" "system_logs_$(legName).logarchive"
      sudo rm -rf "$(Agent.TempDirectory)/logs/system_logs_$(legName).logarchive"
    displayName: 'Collect logs'
  - task: PublishBuildArtifacts@1
    displayName: 'Publish logs'
    inputs:
      pathtoPublish: $(Agent.TempDirectory)/logs
      artifactName: logs
