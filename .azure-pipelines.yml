trigger:
- master

jobs:
- job: Ventura
  displayName: 'Ventura'
  pool:
    vmImage: 'macOS-13'
  steps:
  - script: ./test.sh
    displayName: test script
  - script: |
      mkdir -p /Users/runner/sysdiagnose
      sudo sysdiagnose -ub -f /Users/runner/sysdiagnose -A sysdiagnose_$(System.JobPositionInPhase)
    displayName: 'Collect sysdiagnose'
  - task: PublishBuildArtifacts@1
    displayName: 'Publish sysdiagnose'
    inputs:
      pathtoPublish: /Users/runner/sysdiagnose/
      artifactName: sysdiagnose
